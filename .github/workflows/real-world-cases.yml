name: Reviewed real-world cases
on:
  schedule:
    - cron: '41 5 * * 6'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cases:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CALLRIFT_CASES_CACHE: ${{ github.workspace }}/../callrift-real-world-cases
      CALLRIFT_CASE_SET: all
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        env:
          MISE_JOBS: ${{ runner.os == 'Windows' && '1' || '4' }}
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../callrift-real-world-cases
          key: cases-${{ runner.os }}-${{ hashFiles('real-world-cases/manifest.json') }}
      - run: ./.github/scripts/Initialize-TestGit.ps1
      - run: dotnet restore callrift.slnx --locked-mode
      - run: dotnet test tests/Callrift.RealWorldCases/Callrift.RealWorldCases.csproj --no-restore --logger trx
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-cases-${{ runner.os }}
          path: |
            **/TestResults/*.trx
            **/*.received.*
