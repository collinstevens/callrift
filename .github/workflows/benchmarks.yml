name: Benchmark review
on:
  schedule:
    - cron: '47 5 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CALLRIFT_CASES_CACHE: ${{ github.workspace }}/../callrift-real-world-cases
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        env:
          MISE_JOBS: '1'
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../callrift-real-world-cases
          key: cases-${{ runner.os }}-${{ hashFiles('real-world-cases/manifest.json') }}
      - run: dotnet run -c Release --project benchmarks/Callrift.Benchmarks -- --filter '*CommandBenchmarks*' '*WorkspaceBenchmarks*' --job short
      - run: |
          ./scripts/Compare-Benchmarks.ps1 -Baseline benchmarks/baselines/m4-windows-commands.json -Current BenchmarkDotNet.Artifacts/results/Callrift.Benchmarks.CommandBenchmarks-report-full.json
          ./scripts/Compare-Benchmarks.ps1 -Baseline benchmarks/baselines/m3-windows-workspaces.json -Current BenchmarkDotNet.Artifacts/results/Callrift.Benchmarks.WorkspaceBenchmarks-report-full.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results
