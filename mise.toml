[settings]
activate_aggressive = true

[tools]
dotnet = ["11.0.100-rc.1.26425.128", "10.0.303", "10.0.401"]
hk = "2.1.0"
powershell = "7.6.6"
actionlint = "1.7.12"
"github:editorconfig-checker/editorconfig-checker" = "4.0.2"

[tasks.check]
description = "Check all EditorConfig and .NET formatting (CI or explicit full check)"
run = "hk check --all"

[tasks."check:changed"]
description = "Check formatting for unstaged and untracked changes"
run = "hk check --unstaged"

[tasks."hooks:install"]
description = "Install repository Git hooks through mise"
run = "hk install --mise"

[tasks.build]
description = "Build callrift and its verification tools"
run = "dotnet build callrift.slnx"

[tasks.test]
description = "Run the full scenario suite (CI or explicit full run)"
run = "dotnet test tests/Callrift.Scenarios/Callrift.Scenarios.csproj"

[tasks.cases]
description = "Run all pinned real-history snapshots (explicit full run)"
run = "dotnet test tests/Callrift.RealWorldCases/Callrift.RealWorldCases.csproj"

[tasks.workspaces]
description = "Run the full workspace suite (CI or explicit full run)"
run = "dotnet test tests/Callrift.Workspaces/Callrift.Workspaces.csproj"

[tasks."cases:candidates"]
description = "Propose real-world changes for manual review"
run = "dotnet run --project tools/Callrift.RealWorldCases -- candidates"

[tasks.benchmark]
description = "Run stage benchmarks on real-world cases with allocations"
run = "dotnet run -c Release --project benchmarks/Callrift.Benchmarks --"

[tasks.format]
description = "Apply .NET formatting"
run = "dotnet format callrift.slnx"

[tasks.pack]
description = "Pack and exercise local tool installation and dnx"
run = "pwsh -NoProfile -File scripts/Package-Smoke.ps1"

[tasks.sweep]
description = "Analyze recent repository history and record crashes and timings"
run = "dotnet run -c Release --project tools/Callrift.RealWorldCases -- sweep"

[tasks.workflows]
description = "Validate GitHub Actions workflows"
run = "actionlint"

[tasks."test:focused"]
description = "Run selected scenario tests; requires a VSTest filter"
usage = 'arg "<filter>" help="VSTest filter for the affected tests"'
shell = "pwsh -NoProfile -Command"
run = 'dotnet test tests/Callrift.Scenarios/Callrift.Scenarios.csproj --filter $env:usage_filter; exit $LASTEXITCODE'

[tasks."cases:focused"]
description = "Run selected real-world case tests; requires a VSTest filter"
usage = 'arg "<filter>" help="VSTest filter for the affected tests"'
shell = "pwsh -NoProfile -Command"
run = 'dotnet test tests/Callrift.RealWorldCases/Callrift.RealWorldCases.csproj --filter $env:usage_filter; exit $LASTEXITCODE'

[tasks."workspaces:focused"]
description = "Run selected workspace tests; requires a VSTest filter"
usage = 'arg "<filter>" help="VSTest filter for the affected tests"'
shell = "pwsh -NoProfile -Command"
run = 'dotnet test tests/Callrift.Workspaces/Callrift.Workspaces.csproj --filter $env:usage_filter; exit $LASTEXITCODE'
